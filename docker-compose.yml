services:
  # Bundled MySQL used when running the full stack with Docker Compose.
  # (Local development instead uses SQLite via `npm run dev` in ./api.)
  # db:
  #   image: mysql:8.4
  #   container_name: justintube-db
  #   restart: unless-stopped
  #   environment:
  #     # Root credentials used only for container init / administration.
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
  #     # Passed through to the init script (see api/db/init/01-init-justintube.sh).
  #     JUSTINTUBE_DB: ${MYSQL_DATABASE:-justintube}
  #     JUSTINTUBE_USER: ${MYSQL_USER:-justintube}
  #     JUSTINTUBE_PASSWORD: ${MYSQL_PASSWORD:-password}
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   volumes:
  #     - db-data:/var/lib/mysql
  #     - ./api/db/init:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test:
  #       [
  #         "CMD",
  #         "mysqladmin",
  #         "ping",
  #         "-h",
  #         "localhost",
  #         "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
  #       ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    container_name: justintube-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: justintube-api
    restart: unless-stopped
    depends_on:
      # db:
      #   condition: service_healthy
      processing:
        condition: service_started
    environment:
      PORT: ${PORT:-3000}
      # The composed stack always uses the bundled MySQL service.
      DB_CLIENT: sqlite
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-justintube}
      MYSQL_USER: ${MYSQL_USER:-justintube}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      MEDIA_STORAGE_DIRECTORY: /media
      PROCESSING_API_URL: http://processing:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      TRANSCODE_RECONCILE_CRON: ${TRANSCODE_RECONCILE_CRON:-*/5 * * * *}
      TRANSCODE_RECONCILE_STALE_MINUTES: ${TRANSCODE_RECONCILE_STALE_MINUTES:-15}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - media-data:/media
      - ./api/db/data:/app/db/data

  processing:
    build:
      context: ./processing
    container_name: justintube-processing
    restart: unless-stopped
    env_file:
      - ./processing/.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: ${PROCESSING_PORT:-3001}
      MEDIA_STORAGE_DIRECTORY: /media
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_BASE_URL: http://api:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
    ports:
      - "${PROCESSING_PORT:-3001}:3001"
    volumes:
      - media-data:/media

volumes:
  # db-data:
  media-data:
  redis-data:
