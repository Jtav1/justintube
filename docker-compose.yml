services:
  db:
    image: ghcr.io/jtav1/justintube-api:latest
    container_name: justintube-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set - see .env.example}
      JUSTINTUBE_DB: ${MYSQL_DATABASE:-justintube}
      JUSTINTUBE_USER: ${MYSQL_USER:-justintube}
      JUSTINTUBE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set - see .env.example}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: justintube-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set - see .env.example}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Optional - see .env.example - If adv search is disabled you can remove or comment out this service
  search:
    image: getmeili/meilisearch:v1.15.1
    container_name: justintube-search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set - see .env.example}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - search-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  webapi:
    build:
      context: ./webapi
    container_name: ghcr.io/jtav1/justintube-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      processing:
        condition: service_healthy
    env_file:
      - /mnt/user/appdata/justintube/.env
    environment:
      # Everything else lives in .env (see .env.example) and arrives via
      # env_file above. Only values that MUST differ from the host-facing
      # .env because of docker-compose's internal networking/topology stay
      # here - PORT included, since .env's PORT is the host-side published
      # port (see `ports:` below) while the app inside the container always
      # listens on 3000 (other containers reach it at http://webapi:3000).
      PORT: 3000
      DB_CLIENT: mysql
      # You can use your own MYSQL but you have to adjust these yourself should be pretty ez lol
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MEDIA_STORAGE_DIRECTORY: /media
      SITEDATA_STORAGE_DIRECTORY: /sitedata
      PROCESSING_API_URL: http://processing:${PROCESSING_PORT:-3001}
      MEILI_HOST: http://search:7700
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - media-data:/media
      - ./webapi/media/sitedata:/sitedata
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional - see .env.example - If processing features are disabled you can remove or comment out this service
  processing:
    build:
      context: ./processing
    container_name: ghcr.io/jtav1/justintube-processing:latest
    restart: unless-stopped
    env_file:
      - /mnt/user/appdata/justintube/.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Same split as webapi above: app config comes from .env via env_file;
      # only container-topology values are overridden here.
      PORT: ${PROCESSING_PORT:-3001}
      MEDIA_STORAGE_DIRECTORY: /media
      REDIS_HOST: redis
      API_BASE_URL: http://webapi:3000
    # REQUIRED for hw accel transcoding
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - media-data:/media
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Streaming is completely experimental. See .env.example - uncomment this if you turn it on
  # No guarntees itll work tho lol
  # streaming:
  #   build:
  #     context: ./streaming
  #   container_name: justintube-streaming
  #   restart: unless-stopped
  #   depends_on:
  #     webapi:
  #       condition: service_healthy
  #   environment:
  #     API_BASE_URL: http://webapi:3000
  #     INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set - see .env.example}
  #     MTX_AUTHHTTPADDRESS: http://webapi:3000/internal/livestreams/mediamtx-auth?token=${INTERNAL_SERVICE_TOKEN}
  #   ports:
  #     # RTMP ingest (OBS) and HLS playback both need to be reachable
  #     # directly by external clients
  #     - "1935:1935"
  #     - "8888:8888"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://127.0.0.1:9997/v3/config/global/get"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  webview:
    build:
      context: ./webview
    container_name: ghcr.io/jtav1/justintube-webview:latest
    restart: unless-stopped
    depends_on:
      webapi:
        condition: service_healthy
    env_file:
      - /mnt/user/appdata/justintube/.env
    ports:
      - "${WEBVIEW_PORT:-5173}:8080"

# You probably definitely want to set these to be persistent. Vars are available in .env
volumes:
  db-data:
  media-data:
  redis-data:
  search-data:
