services:
  # Bundled MySQL used when running the full stack with Docker Compose.
  # (Local development instead uses SQLite via `npm run dev` in ./api.)
  db:
    image: mysql:8.4
    container_name: justintube-db
    restart: unless-stopped
    environment:
      # Root credentials used only for container init / administration.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      # Passed through to the init script (see api/db/init/01-init-justintube.sh).
      JUSTINTUBE_DB: ${MYSQL_DATABASE:-justintube}
      JUSTINTUBE_USER: ${MYSQL_USER:-justintube}
      JUSTINTUBE_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: justintube-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      # The composed stack always uses the bundled MySQL service.
      DB_CLIENT: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-justintube}
      MYSQL_USER: ${MYSQL_USER:-justintube}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  db-data:
