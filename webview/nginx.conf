# Known link-unfurl / preview-fetch bots (Slack, Discord, Twitter, Facebook,
# Telegram, WhatsApp, LinkedIn, Skype, Reddit, Pinterest). NOT an SEO-crawler
# allowlist - these are triggered by a user pasting a link into a chat app,
# not by search-engine indexing. Best-effort: some fetchers (notably Apple's
# iMessage link previewer) don't advertise a single stable, documented
# User-Agent and may not match here. `map` must live at http scope (this
# file is included inside nginx's http {} block via conf.d/*.conf).
map $http_user_agent $is_unfurl_bot {
    default 0;
    "~*(facebookexternalhit|Twitterbot|Slackbot|Discordbot|TelegramBot|WhatsApp|LinkedInBot|SkypeUriPreview|redditbot|Pinterest|vkShare|Iframely)" 1;
}

# Combines the UA bot-check with "did the request carry ?v=" into one value:
# the requested videoId when both hold, empty string otherwise.
map "$is_unfurl_bot:$arg_v" $unfurl_video_id {
    default "";
    "~^1:(?<vid>.+)$" $vid;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /video {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: *; media-src 'self' blob: *; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' *; frame-ancestors 'none'" always;

        # Unfurl bots get server-rendered OG/Twitter meta tags from webapi
        # instead of the JS-rendered SPA shell (bots don't execute JS).
        # Real browser requests fall through to try_files unchanged below.
        if ($unfurl_video_id != "") {
            rewrite ^ /__unfurl_proxy last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Internal-only target for the rewrite above. Uses a variable in
    # proxy_pass (rather than a bare hostname) specifically so nginx
    # re-resolves webapi via the resolver directive at request time instead
    # of caching whatever IP it had at nginx startup - matters if the webapi
    # container is ever recreated (new container = new internal IP) while
    # webview keeps running. Only valid when webview and webapi share a
    # Docker Compose network - not portable to a split-host deployment.
    location = /__unfurl_proxy {
        internal;
        set $webapi_upstream "http://webapi:3000/api/v1/videos/$unfurl_video_id/unfurl";
        proxy_pass $webapi_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: *; media-src 'self' blob: *; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' *; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # Vite-hashed assets are safe to cache aggressively/immutably.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: *; media-src 'self' blob: *; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' *; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: *; media-src 'self' blob: *; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' *; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache";
    }

    location = /config.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: *; media-src 'self' blob: *; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' *; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache";
    }
}