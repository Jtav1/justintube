            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /admin/transcode-profiles:
    get:
      tags: [Admin]
      summary: List transcode profiles
      operationId: adminListTranscodeProfiles
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/TranscodeProfile'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Admin]
      summary: Create a transcode profile
      operationId: adminCreateTranscodeProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscodeProfileInput'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeProfile'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /admin/transcode-profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Admin]
      summary: Update transcode profile (resolutions, HW accel)
      operationId: adminUpdateTranscodeProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscodeProfileInput'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeProfile'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [Admin]
      summary: Delete a transcode profile
      operationId: adminDeleteTranscodeProfile
      responses:
        '204':
          description: Deleted
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    VideoId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    PlaylistId:
      name: id
      in: path
      required: true
      schema:
        type: string
    CastId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SsoProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor for infinite scroll

  responses:
    NotImplemented:
      description: Endpoint defined but not implemented yet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string

    Role:
      type: string
      enum: [admin, moderator, uploader, viewer, locked]

    Visibility:
      type: string
      enum: [public, private, hidden, unlisted]

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        displayName:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    AuthSession:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    SsoProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time

    UserChannel:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            subscriberCount:
              type: integer
            videoCount:
              type: integer
            banned:
              type: boolean

    UserSettings:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            videosUploaded:
              type: integer
            subscriberCount:
              type: integer
            linkedSsoProviders:
              type: array
              items:
                type: string

    MeUpdateRequest:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email

    VideoThumbnail:
      type: object
      description: Unified video thumbnail card fields
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        authorId:
          type: string
        durationSeconds:
          type: integer
        views:
          type: integer
        publishedAt:
          type: string
          format: date-time
        thumbnailUrl:
          type: string
          format: uri
        likes:
          type: integer

    Video:
      allOf:
        - $ref: '#/components/schemas/VideoThumbnail'
        - type: object
          properties:
            description:
              type: string
            tags:
              type: array
              items:
                type: string
            visibility:
              $ref: '#/components/schemas/Visibility'
            featured:
              type: boolean
            delisted:
              type: boolean
            playlistIds:
              type: array
              items:
                type: string

    VideoCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        playlistIds:
          type: array
          items:
            type: string
        featured:
          type: boolean
          description: Admin only
        forceTranscode:
          type: boolean
          description: Admin only

    VideoUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        playlistIds:
          type: array
          items:
            type: string
        featured:
          type: boolean
        forceTranscode:
          type: boolean

    VideoList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoThumbnail'
        page:
          type: integer
        nextCursor:
          type: string
          nullable: true
        total:
          type: integer

    VideoStream:
      type: object
      properties:
        qualities:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                example: 720p
              url:
                type: string
                format: uri
        originalUrl:
          type: string
          format: uri

    TranscodeJob:
      type: object
      properties:
        videoId:
          type: string
        status:
          type: string
          enum: [queued, processing, success, failed]
        progress:
          type: number
          minimum: 0
          maximum: 1
        variants:
          type: array
          items:
            type: string
          example: [480p, 720p]
        failureReason:
          type: string
          nullable: true

    ReactionState:
      type: object
      properties:
        reaction:
          type: string
          enum: [like, dislike, none]
        likes:
          type: integer
        dislikes:
          type: integer

    SubscriptionState:
      type: object
      properties:
        subscribed:
          type: boolean
        subscriberCount:
          type: integer

    Tag:
      type: object
      properties:
        name:
          type: string
        videoCount:
          type: integer

    SearchSuggestions:
      type: object
      properties:
        titles:
          type: array
          items:
            type: string
        descriptions:
          type: array
          items:
            type: string
        usernames:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    LikeReceivedList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              videoId:
                type: string
              videoTitle:
                type: string
              likedByUsername:
                type: string
              likedAt:
                type: string
                format: date-time
        nextCursor:
          type: string
          nullable: true

    SubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserChannel'

    SubscriberList:
      type: object
      properties:
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'

    Playlist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoThumbnail'

    PlaylistList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'

    PlaylistCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    PlaylistUpdateRequest:
      type: object
      properties:
        name:
          type: string
        itemOrder:
          type: array
          items:
            type: string
          description: Video ids in desired order

    CastSession:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sessionCode:
          type: string
          description: Code other users enter to join the session
        sourcePlaylistId:
          type: string
          nullable: true
          description: Playlist the queue was seeded from, if any (never mutated by the session)
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/CastMember'
        queue:
          type: array
          items:
            $ref: '#/components/schemas/CastQueueItem'
        history:
          type: array
          description: Recently played items (most recent first, capped at 10)
          items:
            $ref: '#/components/schemas/CastQueueItem'
        nowPlaying:
          oneOf:
            - $ref: '#/components/schemas/CastQueueItem'
            - type: 'null'
        playback:
          $ref: '#/components/schemas/CastPlayback'
        displayConnected:
          type: boolean
          description: Whether a display client is currently registered

    CastQueueItem:
      allOf:
        - $ref: '#/components/schemas/VideoThumbnail'
        - type: object
          properties:
            itemId:
              type: string
              description: Unique per queue entry; the same video may appear more than once
            addedBy:
              type: string
            addedAt:
              type: string
              format: date-time

    CastMember:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [host, guest, display]
        joinedAt:
          type: string
          format: date-time

    CastPlayback:
      type: object
      properties:
        status:
          type: string
          enum: [idle, playing, paused]
        positionSeconds:
          type: number
        updatedAt:
          type: string
          format: date-time

    CastDisplay:
      type: object
      properties:
        sessionId:
          type: string
        currentVideo:
          $ref: '#/components/schemas/CastQueueItem'
        playback:
          $ref: '#/components/schemas/CastPlayback'

    CastSessionCreateRequest:
      type: object
      description: Seed the session queue from `playlistId` or `videoId` (provide at most one), or start empty.
      properties:
        name:
          type: string
        playlistId:
          type: string
          description: Seed the queue with a copy of this playlist's items
        videoId:
          type: string
          description: Seed the queue with this single video
        password:
          type: string
          format: password
          description: Optional extra join password on top of the session code

    CastJoinRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Session code from the session creator
        password:
          type: string
          format: password
        displayName:
          type: string

    CastSyncInfo:
      type: object
      properties:
        protocol:
          type: string
          const: socket.io
        path:
          type: string
          description: Socket.IO handshake path
          examples: ['/socket.io']
        namespace:
          type: string
          examples: ['/cast']
        room:
          type: string
          description: Session room to join via `session:hello`
        stream:
          $ref: '#/components/schemas/VideoStream'

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [video_interaction, subscribed_upload]
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
        href:
          type: string

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unreadCount:
          type: integer
        nextCursor:
          type: string
          nullable: true

    NotificationPreferences:
      type: object
      properties:
        emailEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
        subscribedUploads:
          type: boolean
        videoInteractions:
          type: boolean

    StaticPage:
      type: object
      properties:
        title:
          type: string
        bodyMarkdown:
          type: string
        updatedAt:
          type: string
          format: date-time

    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            banned:
              type: boolean
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
            storageUsedBytes:
              type: integer

    AdminUserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextCursor:
          type: string
          nullable: true
        total:
          type: integer

    AdminUserUpdateRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          type: string
        email:
          type: string
          format: email
        banned:
          type: boolean

    TranscodeProfile:
      allOf:
        - $ref: '#/components/schemas/TranscodeProfileInput'
        - type: object
          properties:
            id:
              type: string

    TranscodeProfileInput:
      type: object
      properties:
        name:
          type: string
        resolutions:
          type: array
          items:
            type: string
          example: [480p, 720p]
        hwAccel:
          type: string
          enum: [none, nvenc, qsv, vaapi]
          default: none
        enabled:
          type: boolean
