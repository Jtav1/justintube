  /cast:
    post:
      tags: [Cast]
      summary: Create a CAST session, optionally seeded from a playlist or video
      description: |
        Starts a shared watch session. The session queue is a live copy seeded
        from `playlistId` or `videoId` (or starts empty); session activity never
        mutates the source playlist. The response includes the `sessionCode`
        other users enter to join.
      operationId: createCastSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastSessionCreateRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cast/join:
    post:
      tags: [Cast]
      summary: Join a CAST session by session code
      operationId: joinCastSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastJoinRequest'
      responses:
        '200':
          description: Joined session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cast/{id}:
    get:
      tags: [Cast]
      summary: Session snapshot (queue, members, now playing, playback)
      operationId: getCastSession
      parameters:
        - $ref: '#/components/parameters/CastId'
      responses:
        '200':
          description: Cast session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [Cast]
      summary: End the session (host only)
      operationId: endCastSession
      parameters:
        - $ref: '#/components/parameters/CastId'
      responses:
        '204':
          description: Session ended
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cast/{id}/queue:
    post:
      tags: [Cast]
      summary: Add a video to the session queue
      operationId: addCastQueueItem
      parameters:
        - $ref: '#/components/parameters/CastId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [videoId]
              properties:
                videoId:
                  type: string
      responses:
        '200':
          description: Queue updated
          content:
