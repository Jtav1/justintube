        '501':
          $ref: '#/components/responses/NotImplemented'

  /pages/rules:
    get:
      tags: [Pages]
      summary: Rules content
      security: []
      operationId: getRulesPage
      responses:
        '200':
          description: Page content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticPage'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /admin/users:
    get:
      tags: [Admin]
      summary: List users with all attributes
      operationId: adminListUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Role assignment and attribute edits
      operationId: adminUpdateUser
