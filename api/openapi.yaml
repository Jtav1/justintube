openapi: 3.1.0
info:
  title: Justintube API
  version: 0.0.1
  description: |
    REST API surface derived from Views.md. Endpoints return `501 Not Implemented`
    until handlers are built. CAST realtime sync uses Socket.IO (namespace `/cast`,
    one room per session); `GET /api/v1/cast/{id}/sync` returns connection details.
  contact:
    name: Justin Tavares
    url: https://github.com/Jtav1/justintube

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: Registration, login, email verification, password, and SSO
  - name: Search
    description: Typeahead suggestions and full search
  - name: Discovery
    description: Home feeds, tags, subscriptions, library lists
  - name: Videos
    description: Watch, upload, edit, visibility, and transcode
  - name: Engagement
    description: Likes, dislikes, and channel subscriptions
  - name: Users
    description: Channels, settings, bans
  - name: Playlists
    description: Personal playlists
  - name: Cast
    description: Shared CAST watch sessions built on playlists (join by session code)
  - name: Notifications
    description: In-app tray and email preferences
  - name: Admin
    description: User management and transcode profiles
  - name: Pages
    description: Static About/Contact and Rules content
  - name: System
    description: Health and OpenAPI

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register with email and password
      security: []
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      security: []
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      operationId: authLogout
      responses:
        '204':
          description: Logged out
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and role for top-bar RBAC
      operationId: authMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email (required before uploader role)
      operationId: authVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend email verification
      operationId: authResendVerification
      responses:
        '204':
          description: Verification email sent
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/password:
    post:
      tags: [Auth]
      summary: Change password
      operationId: authChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '204':
          description: Password updated
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/sso/providers:
    get:
      tags: [Auth]
      summary: List SSO providers for login buttons
      security: []
      operationId: authSsoProviders
      responses:
        '200':
          description: Available SSO providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/SsoProvider'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/sso/{provider}/start:
    get:
      tags: [Auth]
      summary: Begin SSO login flow
      security: []
      operationId: authSsoStart
      parameters:
        - $ref: '#/components/parameters/SsoProvider'
      responses:
        '302':
          description: Redirect to identity provider
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/sso/{provider}/callback:
    get:
      tags: [Auth]
      summary: SSO OAuth/OIDC callback
      security: []
      operationId: authSsoCallback
      parameters:
        - $ref: '#/components/parameters/SsoProvider'
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect into app with session
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/sso/link:
    post:
      tags: [Auth]
      summary: Link SSO identity to the current account
      operationId: authSsoLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code]
              properties:
                provider:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: SSO linked
        '501':
          $ref: '#/components/responses/NotImplemented'

  /auth/sso/link/{provider}:
    delete:
      tags: [Auth]
      summary: Unlink an SSO provider
      operationId: authSsoUnlink
      parameters:
        - $ref: '#/components/parameters/SsoProvider'
      responses:
        '204':
          description: SSO unlinked
        '501':
          $ref: '#/components/responses/NotImplemented'

  /search/suggest:
    get:
      tags: [Search]
      summary: Search typeahead (title, description, username, tags)
      security: []
      operationId: searchSuggest
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Suggestion list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestions'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /search:
    get:
      tags: [Search]
      summary: Search videos by relevance
      security: []
      operationId: searchVideos
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos:
    get:
      tags: [Discovery]
      summary: Home video grid (excludes private/unlisted/hidden for public viewers)
      security: []
      operationId: listVideos
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, recommended, liked]
            default: newest
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated public videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Videos]
      summary: Create a video record (metadata before or during upload)
      operationId: createVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCreateRequest'
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/featured:
    get:
      tags: [Discovery]
      summary: Featured videos for the home carousel
      security: []
      operationId: listFeaturedVideos
      responses:
        '200':
          description: Featured videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/newest:
    get:
      tags: [Discovery]
      summary: Newest videos sidebar feed
      security: []
      operationId: listNewestVideos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/upload:
    post:
      tags: [Videos]
      summary: Upload video file (multipart)
      operationId: uploadVideo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                videoId:
                  type: string
                  description: Existing video id when uploading after metadata create
      responses:
        '201':
          description: Upload accepted; transcode enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/import:
    post:
      tags: [Videos]
      summary: Import a video via yt-dlp from a URL
      operationId: importVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                name:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                visibility:
                  $ref: '#/components/schemas/Visibility'
                playlistIds:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Import job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [Videos]
      summary: Video watch metadata
      security: []
      operationId: getVideo
      responses:
        '200':
          description: Video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '501':
          $ref: '#/components/responses/NotImplemented'
    patch:
      tags: [Videos]
      summary: Edit video metadata, visibility, playlists; admin featured/force-transcode
      operationId: updateVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUpdateRequest'
      responses:
        '200':
          description: Updated video
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [Videos]
      summary: Delete video (owner or admin)
      operationId: deleteVideo
      responses:
        '204':
          description: Deleted
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/stream:
    get:
      tags: [Videos]
      summary: Playback URLs and available qualities
      security: []
      operationId: getVideoStream
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Stream manifests and quality URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStream'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/delist:
    post:
      tags: [Videos]
      summary: Moderator de-list a video
      operationId: delistVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Video delisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/access:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [Videos]
      summary: List private-access grants
      operationId: listVideoAccess
      responses:
        '200':
          description: Granted usernames
          content:
            application/json:
              schema:
                type: object
                properties:
                  usernames:
                    type: array
                    items:
                      type: string
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      tags: [Videos]
      summary: Set private visibility grants by username
      operationId: setVideoAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Grants updated
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/transcode:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [Videos]
      summary: Transcode job status for owner
      operationId: getVideoTranscode
      responses:
        '200':
          description: Transcode status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeJob'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Videos]
      summary: Admin force re-transcode
      operationId: forceVideoTranscode
      responses:
        '202':
          description: Transcode enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeJob'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/view:
    post:
      tags: [Discovery]
      summary: Record a view and optional watch history position
      operationId: recordVideoView
      parameters:
        - $ref: '#/components/parameters/VideoId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                positionSeconds:
                  type: number
                  minimum: 0
      responses:
        '204':
          description: View recorded
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/like:
    post:
      tags: [Engagement]
      summary: Like a video
      operationId: likeVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Like applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionState'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/dislike:
    post:
      tags: [Engagement]
      summary: Dislike a video
      operationId: dislikeVideo
      parameters:
        - $ref: '#/components/parameters/VideoId'
      responses:
        '200':
          description: Dislike applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionState'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /videos/{id}/reaction:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [Engagement]
      summary: Current user reaction on a video
      operationId: getVideoReaction
      responses:
        '200':
          description: Reaction state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionState'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [Engagement]
      summary: Clear like or dislike
      operationId: clearVideoReaction
      responses:
        '200':
          description: Reaction cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionState'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /tags:
    get:
      tags: [Discovery]
      summary: Browse tags
      security: []
      operationId: listTags
      responses:
        '200':
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /tags/{tag}/videos:
    get:
      tags: [Discovery]
      summary: Videos for a tag
      security: []
      operationId: listTagVideos
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Videos for tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /feed/subscriptions:
    get:
      tags: [Discovery]
      summary: My subscriptions feed
      operationId: feedSubscriptions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Subscription feed videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me:
    patch:
      tags: [Users]
      summary: Update profile settings (display name, email, username)
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/settings:
    get:
      tags: [Users]
      summary: Settings payload (creation date, role, video count, SSO)
      operationId: getMeSettings
      responses:
        '200':
          description: Account settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/videos:
    get:
      tags: [Discovery]
      summary: My Media
      operationId: listMyVideos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current user videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/history:
    get:
      tags: [Discovery]
      summary: Watch history
      operationId: listMyHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: History items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'
    delete:
      tags: [Discovery]
      summary: Clear watch history
      operationId: clearMyHistory
      responses:
        '204':
          description: History cleared
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/likes:
    get:
      tags: [Discovery]
      summary: Liked videos library
      operationId: listMyLikes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Liked videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/like-history:
    get:
      tags: [Users]
      summary: My like history (settings)
      operationId: listMyLikeHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Like history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/videos/likes-received:
    get:
      tags: [Users]
      summary: Others liking my videos
      operationId: listLikesReceived
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Incoming likes on owned videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeReceivedList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/subscriptions:
    get:
      tags: [Users]
      summary: Channels I am subscribed to
      operationId: listMySubscriptions
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/subscribers:
    get:
      tags: [Users]
      summary: My subscribers list and count
      operationId: listMySubscribers
      responses:
        '200':
          description: Subscribers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/playlists:
    get:
      tags: [Playlists]
      summary: My playlists
      operationId: listMyPlaylists
      responses:
        '200':
          description: Playlist list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /me/notification-preferences:
    get:
      tags: [Notifications]
      summary: Notification preferences including email option
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '501':
          $ref: '#/components/responses/NotImplemented'
    patch:
      tags: [Notifications]
      summary: Update notification preferences
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /users/{username}:
    get:
      tags: [Users]
      summary: User channel header and metadata
      security: []
      operationId: getUserChannel
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Channel profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserChannel'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /users/{username}/videos:
    get:
      tags: [Users]
      summary: Channel videos (sortable)
      security: []
      operationId: listUserVideos
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, likes, views, alpha]
            default: date
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Channel videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoList'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /users/{id}/subscribe:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
