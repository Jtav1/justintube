                    type: string
                all:
                  type: boolean
      responses:
        '204':
          description: Marked read
        '501':
          $ref: '#/components/responses/NotImplemented'

  /pages/about:
    get:
      tags: [Pages]
      summary: About / Contact content
      security: []
      operationId: getAboutPage
      responses:
        '200':
          description: Page content
          content:
            application/json:
              schema:
