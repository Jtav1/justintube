        '501':
          $ref: '#/components/responses/NotImplemented'

  /cast/{id}/queue/{itemId}:
    delete:
      tags: [Cast]
      summary: Remove an item from the session queue
      description: |
        Keyed by queue `itemId` (not `videoId`) — the same video may appear in
        the queue more than once.
      operationId: removeCastQueueItem
      parameters:
        - $ref: '#/components/parameters/CastId'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSession'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cast/{id}/display:
    get:
      tags: [Cast]
      summary: Payload for the in-app display view (cast the tab)
      operationId: getCastDisplay
      parameters:
        - $ref: '#/components/parameters/CastId'
      responses:
        '200':
          description: Minimal display payload for casting the tab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastDisplay'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cast/{id}/sync:
    get:
      tags: [Cast]
      summary: Socket.IO connection details for realtime session sync
      description: |
        Realtime sync uses Socket.IO (namespace `/cast`, one room per session),
        not a plain WebSocket upgrade on this path. This endpoint returns the
        connection details a client needs. Event names are defined in
        `api/cast/events.js` and must stay in sync with this catalog.

        Client → server events:
        - `session:hello { sessionId, displayName? }` — join the session room; server replies with a `state` snapshot
        - `presence:setName { name }`
        - `queue:add { videoId }` (ack), `queue:remove { itemId }`, `queue:move { itemId, toIndex }`
        - `player:play`, `player:pause`, `player:skip`, `player:previous`, `player:seek { seconds }`
        - `react { emoji }`
        - Display client: `player:register`, `player:status { status, currentTime }`, `player:ended`

        Server → client events:
        - `state` (full CastSession snapshot)
        - `player:tick { currentTime, status }`
        - `activity { name, text, at }`
        - `react { emoji, name }`
        - Display-only: `player:load { item }`, `player:play`, `player:pause`, `player:seek { seconds }`
      operationId: getCastSyncInfo
      parameters:
        - $ref: '#/components/parameters/CastId'
      responses:
        '200':
          description: Socket.IO connection info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CastSyncInfo'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /notifications:
